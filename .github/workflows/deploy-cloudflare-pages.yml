name: Deploy to Cloudflare Pages

# Cloudflare migration, Stage 1 (see docs/cloudflare-pages-evaluation.md).
# Direct Upload only -- this workflow does NOT let Cloudflare build from source.
# It uploads whatever static HTML already exists at the repo root after the
# existing generation pipeline (content-expansion.yml, the local rate-update
# cron, or a manual regen) has already committed it. Runs on every push to
# main regardless of which of those three writers pushed. NOTE: this repo
# (CLSCRE/cls-website) IS the site root once checked out standalone -- there
# is no nested "website/" folder here (that nesting only exists in the local
# "SEO Programmatic" parent project, where this repo lives as a subfolder).
#
# NOTE (2026-07-14): switched from classic "wrangler pages deploy" to Workers
# Static Assets ("wrangler deploy" + an [assets] block) because classic Pages
# hard-redirects every /foo.html request to /foo with no documented way to
# disable it -- a silent, sitewide URL-scheme change this site cannot absorb
# (every canonical tag, the sitemap, and years of GSC-indexed URLs all use
# explicit .html). Workers Static Assets exposes `html_handling = "none"`,
# which serves .html files literally with no redirect, matching GitHub
# Pages' current behavior exactly. Deploys as a Worker named cls-website-
# static, a separate resource from the (now unused) cls-website Pages
# project created during earlier debugging -- harmless to leave orphaned.
#
# NOTE (2026-07-15): html_handling="none" turned out to disable ALL implicit
# HTML resolution, not just the unwanted .html-stripping -- it also broke
# "/" -> "/index.html" and "/markets/{city}/" -> ".../index.html", both of
# which are real, already-GSC-indexed URL patterns this site depends on.
# Fixed with a minimal custom Worker (_worker/index.js) that does ONLY the
# directory -> index.html rewrite itself, internally (env.ASSETS.fetch, no
# HTTP redirect visible to any client or crawler), and passes every other
# path through untouched -- so .html files still serve literally at 200.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   -- scoped to Account.Cloudflare Pages:Edit (NOT the
#                             zone-scoped token used elsewhere in this project)
#   CLOUDFLARE_ACCOUNT_ID  -- 8afb77766fa8023f517c5e389360dc6d
# Until both secrets exist this workflow will fail at the deploy step -- that
# is expected and harmless; GitHub Pages remains the live origin throughout
# Stage 1 and 2, so a failure here has zero effect on clscre.com.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1   # shallow -- the .git history is 11GB, we only need the current tree

      # _generator/ is generator source + data (not site content) and contains
      # a 45.8 MiB JSON file that trips the 25 MiB per-file cap outright.
      # .claude/ and scripts/ are also non-site internals that should never
      # have been publicly servable in the first place (GitHub Pages has been
      # serving them accidentally -- worth a follow-up to remove them there
      # too). Staging a clean folder sidesteps the size limit AND cuts
      # thousands of files that never needed to be part of the public site.
      - name: Stage deployable site (exclude generator source/data)
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='_generator' \
            --exclude='scripts' \
            --exclude='_deploy' \
            ./ _deploy/
          echo "Staged file count: $(find _deploy -type f | wc -l)"

      # Rewrites "/" and "/dir/" to their index.html internally (server-side,
      # no HTTP redirect) so directory-index pages keep working. Everything
      # else -- crucially every .html path -- passes straight through to
      # ASSETS.fetch() untouched, so html_handling=none's literal serving is
      # preserved for the pages that make up the vast majority of the site.
      #
      # BUG FOUND 2026-07-15 (live, post-cutover): real browser top-level page
      # loads send `Sec-Fetch-Mode: navigate` (+ other Sec-Fetch-* headers).
      # Reproduced with curl -H "Sec-Fetch-Mode: navigate": 404. First fix
      # attempt (fresh Request with {method, headers: request.headers}) did
      # NOT resolve it -- the Fetch spec forbids scripts from setting several
      # of these browser-managed headers on a constructed Request, so copying
      # the whole Headers object throws. curl never reproduced any of this
      # because curl doesn't send Sec-Fetch-* by default. Real fix: don't
      # forward headers at all for this internal rewrite -- it's a static
      # asset fetch, not a proxy, so it doesn't need to replay the client's
      # original headers.
      - name: Write directory-index rewrite worker
        run: |
          mkdir -p _worker
          cat > _worker/index.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              // Force HTTPS: plain-HTTP requests were serving 200 with no
              // redirect after the Workers cutover (zone-level "Always Use
              // HTTPS" is not enabled and the zone API token cannot flip it),
              // so enforce the 301 here at the worker instead.
              if (url.protocol === "http:") {
                url.protocol = "https:";
                return Response.redirect(url.toString(), 301);
              }
              if (url.pathname.endsWith("/")) {
                url.pathname += "index.html";
                return env.ASSETS.fetch(new Request(url));
              }
              return env.ASSETS.fetch(request);
            },
          };
          EOF

      # run_worker_first=true forces our fetch() handler to run for every
      # request BEFORE Cloudflare's built-in asset-matching/not_found
      # fallback. Without it, the two prior fix attempts (rebuilding the
      # Request object different ways) both still 404'd on navigation
      # requests -- strong evidence the built-in fallback was intercepting
      # "/" before our rewrite logic ever ran, specifically for real
      # top-level navigations (Sec-Fetch-Dest: document).
      - name: Write wrangler config (html_handling=none, no redirect stripping)
        run: |
          cat > wrangler.toml <<'EOF'
          name = "cls-website-static"
          main = "_worker/index.js"
          compatibility_date = "2026-07-14"

          [assets]
          directory = "./_deploy"
          binding = "ASSETS"
          html_handling = "none"
          not_found_handling = "404-page"
          run_worker_first = true
          EOF

      - name: Deploy to Cloudflare (Workers Static Assets, Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
