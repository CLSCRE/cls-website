name: Auto Content Expansion
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Cities to add per run (default 3)'
        default: '3'
        required: false

jobs:
  expand:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jinja2 anthropic requests python-dotenv

      - name: Run content expansion
        run: python _generator/auto_expand.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '3' }}

      - name: Content quality smoke test (pre-push gate)
        run: |
          # Closes audit anti-pattern #12. Fail the workflow if the
          # generator produced HTML with unresolved Jinja, placeholder
          # literals, empty titles, or other catastrophic rendering bugs.
          # Warnings (dashes, multi-H1, FAQ-schema mismatches) are logged
          # but do not block. The script is in the PARENT repo (the SEO
          # Programmatic engine), so we fetch the latest version inline.
          # If the fetch fails (private repo / network), we log and skip
          # rather than block the workflow — the goal is defense in depth,
          # not a hard dependency on the parent repo.
          if curl -fsSL https://raw.githubusercontent.com/CLSCRE/social-media-engine/main/scripts/content_quality_check.py -o /tmp/content_quality_check.py; then
            python /tmp/content_quality_check.py --website-root "$(pwd)" --max-issues 50
          else
            echo "WARN: could not fetch quality check script from parent repo, skipping"
            exit 0
          fi

      - name: Commit and push generated content
        run: |
          git config user.email "bot@clscre.com"
          git config user.name "CLS CRE Content Bot"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit — exiting cleanly."
            exit 0
          fi
          git commit -m "auto: content expansion $(date +'%Y-%m-%d %H:%M UTC') [skip actions]"
          # Retry push up to 3 times with pull-rebase between attempts.
          # Handles: (a) transient GitHub `fatal error in commit_refs`,
          #          (b) races with the local rate-update bot pushing concurrently,
          #          (c) post-deploy ref locks during GitHub Pages publish.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; backoff + pull-rebase"
            sleep $((attempt * 15))
            git pull --rebase origin main || { echo "Rebase failed on attempt $attempt"; exit 1; }
          done
          echo "ERROR: all 3 push attempts failed"
          exit 1

      - name: Notify on workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const label = 'workflow-failure';

            // Dedupe: if there's already an open workflow-failure issue,
            // comment on it instead of opening a new one. Prevents issue
            // spam when a problem persists across multiple scheduled runs.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });

            if (existing.data.length > 0) {
              const issueNumber = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Another failure at ${now}.\n\nRun: ${runUrl}\n\nThis is failure #${existing.data[0].comments + 2} on this open issue. If the root cause has been fixed, close this issue and a new one will open if it fails again.`,
              });
              core.setFailed(`Workflow failed. Commented on existing issue #${issueNumber}.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto Content Expansion workflow failed (${now.slice(0, 10)})`,
              body: [
                `The Auto Content Expansion workflow failed at ${now}.`,
                ``,
                `**Run:** ${runUrl}`,
                ``,
                `## What this means`,
                ``,
                `The bot tried to generate + commit new content and either (a) the generator script exited with an error, or (b) all 3 \`git push\` retry attempts failed.`,
                ``,
                `## Likely causes (in rough order of probability)`,
                ``,
                `1. **Transient GitHub error that persisted** — \`fatal error in commit_refs\` lasting longer than 45s (rare). Check the next scheduled run before debugging — it may self-heal.`,
                `2. **Race with local rate-update bot** — both bots tried to push within seconds. The retry usually catches this but extreme cases slip through.`,
                `3. **\`auto_expand.py\` error** — a code or data issue in \`_generator/auto_expand.py\`, \`generate.py\`, or one of the data JSON files. Check the run log's "Run content expansion" step.`,
                `4. **\`generate.py\` template error** — Jinja2 rendering exception. Check the run log's "Run content expansion" step.`,
                ``,
                `## Triage steps`,
                ``,
                `1. Open the run URL above and check which step failed (red X marks it).`,
                `2. If "Commit and push" failed after 3 attempts — likely transient or persistent race. Wait one cycle (~8 hours) before manual intervention.`,
                `3. If "Run content expansion" failed — there's a real bug. Pull the repo locally and reproduce: \`cd website/_generator && python auto_expand.py\`.`,
                `4. Once resolved, **close this issue**. The next failure will open a new one (this isn't reused indefinitely).`,
                ``,
                `<sub>Auto-created by \`.github/workflows/content-expansion.yml\`. To stop these notifications, remove the "Notify on workflow failure" step from that file.</sub>`,
              ].join('\n'),
              labels: [label, 'automation'],
            });
            core.setFailed('Workflow failed. Opened a new tracking issue.');
