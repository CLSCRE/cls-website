name: Pages Deploy Watchdog

# GitHub Pages' own "pages build and deployment" workflow is platform-managed
# (no checked-in .yml, "dynamic" trigger) so we can't add a retry step inside
# it directly. At current site scale (20k+ pages) it fails intermittently --
# sometimes a quick "Deployment failed, try again later", sometimes the
# deploy step stalls in "deployment_queued" until it hits its own timeout.
# Either way the failure is silent: the previous successful deploy just
# keeps serving, so content can lag behind `main` by hours unless someone
# checks the Actions tab. This polls for that and auto-reruns failed jobs.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check latest Pages deployment and rerun if it failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: CLSCRE/cls-website
        run: |
          set -e
          # Watch BOTH deploy paths. deploy-cloudflare-pages.yml is the one that
          # actually ships clscre.com since the 2026-07-15 Workers cutover;
          # pages-build-deployment is the legacy GitHub Pages job kept for parity.
          # Until 2026-08-06 only the legacy one was watched, so when the
          # Cloudflare deploy failed twice during a GitHub runner incident that
          # day nothing retried it and the site silently served stale content.
          FAILED_ANY=0

          for WF in "deploy-cloudflare-pages.yml" "pages-build-deployment"; do
            RUN_JSON=$(gh run list --workflow="$WF" --limit 1 \
              --json databaseId,conclusion,status,attempt 2>/dev/null || echo '[]')

            if [ "$(echo "$RUN_JSON" | jq -r 'length')" = "0" ]; then
              echo "[$WF] no runs found -- skipping."
              continue
            fi

            STATUS=$(echo "$RUN_JSON" | jq -r '.[0].status')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.[0].conclusion')
            RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId')
            ATTEMPT=$(echo "$RUN_JSON" | jq -r '.[0].attempt')

            if [ "$STATUS" != "completed" ]; then
              echo "[$WF] run $RUN_ID still in progress ($STATUS) -- nothing to do."
              continue
            fi

            if [ "$CONCLUSION" = "success" ]; then
              echo "[$WF] run $RUN_ID succeeded -- nothing to do."
              continue
            fi

            if [ "$ATTEMPT" -ge 3 ]; then
              echo "::error::[$WF] run $RUN_ID has failed $ATTEMPT times in a row. Not retrying again -- this needs a human look (check the Actions tab; likely an artifact-size/timeout issue at current site scale, or a GitHub runner incident, not a code problem)."
              FAILED_ANY=1
              continue
            fi

            echo "[$WF] run $RUN_ID failed (attempt $ATTEMPT, conclusion $CONCLUSION) -- rerunning failed jobs."
            gh run rerun "$RUN_ID" --repo CLSCRE/cls-website --failed || \
              echo "::warning::[$WF] rerun of $RUN_ID could not be queued (GitHub may be degraded); the next watchdog tick will retry."
          done

          exit $FAILED_ANY
